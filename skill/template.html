<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leave planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap">
<style>
/* Generated by leave-planner/skill/build.py — edit the template, not this file. */
:root{--surface-0:#ECEFF3;--surface-1:#E1E5EB;--surface-2:#FFFFFF;--text-primary:#2A241C;--text-secondary:#5E5548;--text-muted:#8C8273;--text-accent:#B4461F;--border:rgba(40,45,60,.16);--border-stronger:rgba(40,45,60,.34);--border-accent:#D85A30;--font-voice:"Fraunces",Georgia,serif;--font-mono:ui-monospace,Menlo,monospace;
--sf:#D85A30;--sfb:#FAECE7;--sft:#993C1D;--rdb:#FCEBEB;--rdt:#A32D2D;--amb:#FAEEDA;--amt:#854F0B;--grb:#EAF3DE;--grt:#3B6D11;--tlb:#E1F5EE;--tlt:#0F6E56;--tl:#1D9E75;--pub:#EEEDFE;--put:#3C3489;--pu:#7F77DD;--pp:#FFFFFF;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-mode="light"]){--surface-0:#1B1915;--surface-1:#262320;--surface-2:#302C28;--text-primary:#F1ECE3;--text-secondary:#C9C0B2;--text-muted:#9A9184;--text-accent:#F0A07F;--border:rgba(255,240,220,.14);--border-stronger:rgba(255,240,220,.3);--sfb:#712B13;--sft:#F5C4B3;--rdb:#791F1F;--rdt:#F7C1C1;--amb:#633806;--amt:#FAC775;--grb:#27500A;--grt:#C0DD97;--tlb:#085041;--tlt:#9FE1CB;--pub:#3C3489;--put:#CECBF6;--pp:#262320;color-scheme:dark}}
:root[data-mode="dark"]{--surface-0:#1B1915;--surface-1:#262320;--surface-2:#302C28;--text-primary:#F1ECE3;--text-secondary:#C9C0B2;--text-muted:#9A9184;--text-accent:#F0A07F;--border:rgba(255,240,220,.14);--border-stronger:rgba(255,240,220,.3);--sfb:#712B13;--sft:#F5C4B3;--rdb:#791F1F;--rdt:#F7C1C1;--amb:#633806;--amt:#FAC775;--grb:#27500A;--grt:#C0DD97;--tlb:#085041;--tlt:#9FE1CB;--pub:#3C3489;--put:#CECBF6;--pp:#262320;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-0);color:var(--text-primary);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}
.page{max-width:1480px;margin:0 auto;padding:14px 20px}
button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-stronger);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--border-accent)}
.kc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{background:var(--surface-2);border:0.5px solid var(--border);border-radius:10px;padding:6px 8px;display:flex;gap:6px;align-items:center;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cl{position:relative;height:clamp(64px,calc((100vh - 262px) / 6),104px);border-radius:6px;padding:3px 4px 6px;cursor:pointer;background:var(--pp);border:0.5px solid var(--border);overflow:hidden}
.cl:hover{border-color:var(--border-stronger)}
.cl.hl{outline:2px solid var(--tl);outline-offset:-1px}
.cl.sel{outline:2px solid var(--sf);outline-offset:-1px}
.ch{font-size:11px;line-height:1.3;border-radius:3px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn{background:var(--surface-1);border-radius:10px;padding:8px 10px}
.tabs{display:flex;gap:2px;background:var(--surface-1);border-radius:8px;padding:2px;margin:8px 0 6px}
.tb{flex:1;font-size:12px;padding:4px 0;border:none;background:transparent;border-radius:6px;color:var(--text-secondary);cursor:pointer}
.tb.on{background:var(--surface-2);color:var(--text-primary);font-weight:500}
.lw{border:0.5px solid var(--border);background:var(--surface-2);border-radius:8px;padding:5px 7px;display:flex;gap:7px;align-items:center;margin-top:4px;cursor:pointer;font-size:12px}
.lw:hover{border-color:var(--tl)}
.tag{font-size:11px;border-radius:9px;padding:0 6px;white-space:nowrap}
.row{display:flex;gap:6px;align-items:flex-start;font-size:12px;padding:5px 0;border-top:0.5px solid var(--border)}
.sb{font-size:11px;padding:2px 7px}
.sh{font-size:11px;color:var(--text-muted);margin:6px 0 0}
#tp{max-height:calc(100vh - 330px);min-height:200px;overflow:auto}
@media(max-width:900px){.main{grid-template-columns:1fr}.kc{grid-template-columns:repeat(2,minmax(0,1fr))}#tp{max-height:none}}
</style>
</head>
<body>
<div class="page">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<span id="ttl" style="font-family:var(--font-voice);font-size:20px;color:var(--sf)"></span>
<span id="nxt" style="font-size:12px;color:var(--text-secondary)"></span>
<span id="lapse" style="flex:1;min-width:200px"></span>
<span id="sync" style="font-size:11px;color:var(--text-muted)"></span>
<button class="sb" onclick="theme()" aria-label="Switch light or dark"><i class="ti ti-contrast" aria-hidden="true"></i></button></div>
<div class="kc" id="kc" style="margin-top:8px"></div>
<div class="main">
<div>
<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
<button class="sb" onclick="mv(-1)" aria-label="Previous month"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
<span id="mt" style="font-family:var(--font-voice);font-size:22px;color:var(--sf)"></span><span id="yr" style="font-family:var(--font-voice);font-size:16px;color:var(--text-secondary)"></span>
<button class="sb" onclick="mv(1)" aria-label="Next month"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
<span id="ms" style="font-size:11px;color:var(--text-muted);flex:1;text-align:right"></span>
<button class="sb" onclick="m=M0;draw();side()">Today</button></div>
<div class="cal" id="cal"></div>
<div style="display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--text-secondary);margin-top:6px">
<span><span class="tag" style="background:var(--rdb);color:var(--rdt)">Holiday</span></span>
<span><span class="tag" style="background:var(--amb);color:var(--amt)">Optional</span></span>
<span><i class="ti ti-sparkles" style="color:var(--sf)" aria-hidden="true"></i> Festival</span>
<span><i class="ti ti-circle-check" style="color:var(--grt)" aria-hidden="true"></i> Approved</span>
<span><i class="ti ti-clock" style="color:var(--text-accent)" aria-hidden="true"></i> Pending</span>
<span><i class="ti ti-pencil" style="color:var(--pu)" aria-hidden="true"></i> Trying out</span>
<span><i class="ti ti-file-check" aria-hidden="true"></i> In sheet</span>
<span><i class="ti ti-calendar-user" aria-hidden="true"></i> Team cal</span>
<span><span style="display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--tl);vertical-align:middle"></span> Long weekend</span></div>
</div>
<div>
<div class="pn" id="det" style="font-size:12px;color:var(--text-secondary);min-height:58px"></div>
<div id="pbar"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="tp"></div>
</div></div>
</div>
<script>
const D=/*__DATA__*/null;
const Y=D.year,TODAY=D.today,H=D.H,F=D.F,L=D.L,N=D.N,TC=new Set(D.TC),LW=D.LW,B=D.bal,ATT=D.att;
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const KT={free:['Free','var(--tlb)','var(--tlt)'],sug:['Suggested','var(--amb)','var(--amt)'],plan:['Planned','var(--grb)','var(--grt)'],you:['Yours','var(--sfb)','var(--sft)']};
const TONE={accent:'var(--text-accent)',warn:'var(--amt)',muted:'var(--text-muted)'};
const P={};const M0=+TODAY.slice(5,7)-1;let m=M0,tab='lw',sel=null,showPast=false;
const pad=n=>String(n).padStart(2,'0'),dow=k=>new Date(k+'T00:00').getDay(),r1=v=>Math.round(v*10)/10;
const fd=s=>new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function theme(){const r=document.documentElement,cur=r.dataset.mode||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.mode=cur=='dark'?'light':'dark';try{localStorage.setItem('lp-mode',r.dataset.mode)}catch(e){}}
try{const s=localStorage.getItem('lp-mode');if(s)document.documentElement.dataset.mode=s}catch(e){}
function bal(){let cl=B.CL.proj,pl=B.PL.proj;Object.values(P).forEach(t=>t=='CL'?cl--:pl--);return{cl:r1(cl),pl:r1(pl)}}
function ring(v,max,col){const c=2*Math.PI*13,p=Math.max(0,Math.min(1,max?v/max:0));return '<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true" style="flex:none"><circle cx="17" cy="17" r="13" fill="none" stroke="var(--border)" stroke-width="4"/><circle cx="17" cy="17" r="13" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 17 17)"/></svg>'}
function card(t,v,u,sub,rg){return '<div class="k">'+rg+'<div style="min-width:0"><div style="font-size:11px;color:var(--text-secondary);white-space:nowrap">'+t+'</div><div style="font-size:17px;font-weight:500;line-height:1.15">'+v+' <span style="font-size:11px;font-weight:400;color:var(--text-muted)">'+u+'</span></div><div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sub+'</div></div></div>'}
function sub(x){const bits=['sheet '+x.sheet];if(x.not_in_sheet)bits.push(x.not_in_sheet+' not in sheet');if(x.pending)bits.push(x.pending+' pending');return bits.join(', ')}
function cards(){const b=bal(),dc=r1(B.CL.proj-b.cl),dp=r1(B.PL.proj-b.pl),O=B.Optional,E=B.Exchanged;
document.getElementById('kc').innerHTML=card('PL',b.pl,B.PL.not_in_sheet?'proj.':'left',dp?'trying '+dp:sub(B.PL),ring(b.pl,B.PL.max,'#1D9E75'))+card('CL',b.cl,B.CL.not_in_sheet?'proj.':'left',dc?'trying '+dc:sub(B.CL),ring(b.cl,B.CL.max,'#D85A30'))+card('Optional',O.used+'/'+O.allowed,'used',O.pending?O.pending+' pending':(O.allowed-O.used)+' left',ring(O.used+O.pending,O.allowed,'#BA7517'))+card('Exchanged',E.used,'used',E.note||'none',ring(E.used?1:0,1,'#7F77DD'));
const el=document.getElementById('lapse');if(!D.lapse||TODAY.slice(0,4)!=String(Y)){el.innerHTML='';return}
const plx=D.lapse.pl_max!=null?r1(Math.max(0,b.pl-D.lapse.pl_max)):0,plt=plx>0?' · '+plx+' PL over the '+D.lapse.pl_max+'-day carry-forward':'';
el.innerHTML=b.cl>0||plx>0?'<span style="display:inline-flex;gap:6px;align-items:center;border-radius:8px;background:var(--amb);color:var(--amt);padding:3px 10px;font-size:12px"><i class="ti ti-hourglass-low" aria-hidden="true"></i><b style="font-weight:500">'+(b.cl>0?b.cl+' CL':'')+(b.cl>0&&plx>0?' + ':'')+(plx>0?plx+' PL':'')+' may lapse '+fd(D.lapse.date)+'</b>'+(D.lapse.verified?'':' · rule unverified')+' <a href="#" onclick="tab=\'lw\';m=M0;draw();side();return false" style="color:inherit;text-decoration:underline">find weekends</a></span>':'<span style="display:inline-flex;gap:6px;align-items:center;border-radius:8px;background:var(--grb);color:var(--grt);padding:3px 10px;font-size:12px"><i class="ti ti-circle-check" aria-hidden="true"></i> Nothing left to lapse</span>'}
function head(){document.getElementById('ttl').textContent=D.title;document.title=D.title;document.getElementById('yr').textContent=Y;
document.getElementById('nxt').innerHTML=D.next_off?'<i class="ti ti-plane-departure" style="color:var(--sf)" aria-hidden="true"></i> Next off <b style="font-weight:500;color:var(--text-primary)">'+new Date(D.next_off+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+'</b>':'';
const s=[];if(D.synced_at)s.push(fd(D.synced_at.slice(0,10)));if(D.sheet_as_on)s.push('sheet '+fd(D.sheet_as_on));
document.getElementById('sync').innerHTML=s.length?'<i class="ti ti-refresh" aria-hidden="true"></i> '+s.join(' · '):''}
function mv(x){m=Math.min(11,Math.max(0,m+x));draw();side()}
function draw(){const pre=Y+'-'+pad(m+1);document.getElementById('mt').textContent=MN[m];
const hc=Object.keys(H).filter(k=>k.startsWith(pre)&&H[k][0]=='c').length,lc=Object.keys(L).filter(k=>k.startsWith(pre)&&['rec','app','pen'].includes(L[k][1])).length;
document.getElementById('ms').textContent=hc+' holiday'+(hc==1?'':'s')+' · '+lc+' leave day'+(lc==1?'':'s');
let h='';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach((x,i)=>h+='<div style="font-size:11px;text-align:center;color:'+(i==6?'var(--rdt)':'var(--text-secondary)')+';font-weight:'+(i==6?500:400)+'">'+x+'</div>');
const first=(new Date(Y,m,1).getDay()+6)%7,n=new Date(Y,m+1,0).getDate();
for(let i=0;i<first;i++)h+='<div></div>';
for(let dd=1;dd<=n;dd++){const k=pre+'-'+pad(dd),hh=H[k],lv=L[k],w=dow(k),swap=lv&&lv[1]=='swap';
const comp=hh&&hh[0]=='c'&&!swap,op=hh&&hh[0]=='o',red=w==0||comp,inLW=LW.some(x=>k>=x.f&&k<=x.t);
const bg=comp?'var(--rdb)':op?'var(--amb)':w==6||swap?'var(--surface-1)':'var(--pp)';
let c='<div class="cl'+(sel==k?' sel':'')+'" data-k="'+k+'" title="'+esc([hh&&hh[1],F[k],N[k]].filter(Boolean).join(' · '))+'" style="background:'+bg+(k==TODAY?';box-shadow:inset 0 0 0 2px var(--sf)':'')+'" onclick="pick(\''+k+'\')">';
c+='<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:15px;font-weight:500;line-height:1.1;color:'+(red?'var(--rdt)':'var(--text-primary)')+'">'+dd+'</span><span style="font-size:11px;color:var(--text-muted)">'+(TC.has(k)?'<i class="ti ti-calendar-user" aria-label="On team calendar"></i>':'')+(lv&&lv[1]=='rec'?'<i class="ti ti-file-check" aria-label="In HR sheet"></i>':'')+'</span></div>';
if(hh)c+='<div class="ch" style="padding:0;font-weight:500;color:'+(hh[0]=='c'?'var(--rdt)':'var(--amt)')+(swap?';text-decoration:line-through':'')+'">'+esc(hh[1])+'</div>';
else if(F[k])c+='<div class="ch" style="color:var(--sf);padding:0"><i class="ti ti-sparkles" aria-hidden="true"></i> '+esc(F[k])+'</div>';
if(P[k])c+='<div class="ch" style="border:1px dashed var(--pu);background:var(--pub);color:var(--put)"><i class="ti ti-pencil" aria-hidden="true"></i> '+P[k]+'</div>';
else if(lv){const s=lv[1],ic={rec:'ti-circle-check',app:'ti-circle-check',pen:'ti-clock',can:'ti-circle-x',dec:'ti-circle-x',swap:'ti-briefcase'}[s];
const st={rec:'background:var(--grb);color:var(--grt)',app:'background:var(--grb);color:var(--grt)',pen:'border:1px dashed var(--border-accent);color:var(--text-accent)',can:'color:var(--text-muted);text-decoration:line-through',dec:'color:var(--text-muted);text-decoration:line-through',swap:'color:var(--text-secondary)'}[s];
c+='<div class="ch" style="'+st+'"><i class="ti '+ic+'" aria-hidden="true"></i> '+esc(lv[0])+'</div>';}
if(inLW)c+='<div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tl)"></div>';
h+=c+'</div>';}
document.getElementById('cal').innerHTML=h;}
function pick(k){sel=k;draw();det()}
function det(){const el=document.getElementById('det');if(!sel){el.innerHTML='<i class="ti ti-hand-click" aria-hidden="true"></i> Click a day for details or to plan it.';return}
const k=sel,hh=H[k],lv=L[k],w=dow(k);let s='<div style="font-weight:500;color:var(--text-primary)">'+new Date(k+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'</div>';
const bits=[];if(hh)bits.push((hh[0]=='c'?'Holiday: ':'Optional: ')+esc(hh[1]));if(F[k])bits.push('Festival: '+esc(F[k]));
if(lv)bits.push(lv[1]=='swap'?esc(N[k]):esc(lv[0])+' · '+esc(N[k]));
if(TC.has(k))bits.push('On team calendar');const wk=LW.find(x=>k>=x.f&&k<=x.t);if(wk)bits.push('<span style="color:var(--tlt)">Part of '+wk.d+'-day long weekend</span>');
s+='<div>'+(bits.join(' · ')||'Nothing on this day.')+'</div>';
const free=w!=0&&w!=6&&!(hh&&hh[0]=='c')&&!(lv&&['rec','app','pen'].includes(lv[1]))&&k>=TODAY;
if(free||P[k])s+='<button class="sb" style="margin-top:4px" onclick="planDay(\''+k+'\')"><i class="ti ti-pencil" aria-hidden="true"></i> '+(P[k]?'Remove from plan':'Plan this day')+'</button>';
el.innerHTML=s}
function planLW(i){const x=LW[i],on=x.lv.every(k=>P[k]);x.lv.forEach(k=>{if(on)delete P[k];else if(!P[k])P[k]=bal().cl>=1?'CL':'PL'});all()}
function planDay(k){if(P[k])delete P[k];else P[k]=bal().cl>=1?'CL':'PL';all()}
function all(){cards();draw();det();pbar();side()}
function cp(t,b){const ok=()=>{const o=b.innerHTML;b.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> Copied';setTimeout(()=>b.innerHTML=o,1400)};try{navigator.clipboard.writeText(t).then(ok,()=>{b.textContent=t})}catch(e){b.textContent=t}}
function pbar(){const ks=Object.keys(P).sort(),el=document.getElementById('pbar');if(!ks.length){el.innerHTML='';return}
const by={};ks.forEach(k=>(by[P[k]]=by[P[k]]||[]).push(k));const cmd=Object.entries(by).map(([t,ds])=>'/leave-dashboard request '+ds.join(',')+' '+t).join(' ; ');
el.innerHTML='<div style="border-radius:10px;border:1px dashed var(--pu);background:var(--pub);color:var(--put);padding:6px 10px;margin-top:8px;font-size:12px"><div><i class="ti ti-pencil" aria-hidden="true"></i> <b style="font-weight:500">Trying out:</b> '+ks.map(k=>fd(k)+' '+P[k]).join(', ')+'</div><code style="display:block;margin:4px 0;font-size:11px;font-family:var(--font-mono);word-break:break-all">'+cmd+'</code><div style="display:flex;gap:6px"><button class="sb" onclick="cp(\''+cmd+'\',this)"><i class="ti ti-mail" aria-hidden="true"></i> Copy draft command</button><button class="sb" onclick="for(const k in P)delete P[k];all()">Clear</button></div></div>'}
function lwRow(x,i){const t=KT[x.k]||KT.free,on=x.lv.length&&x.lv.every(k=>P[k]);
return '<div class="lw" onmouseenter="hl('+i+')" onmouseleave="hl(-1)" onclick="if(event.target.tagName!=\'BUTTON\'){m=Math.min(11,Math.max(0,+x_f('+i+')));draw();side()}"><span style="min-width:30px;text-align:center;border-radius:6px;background:var(--tlb);color:var(--tlt);font-weight:500;padding:2px 0">'+x.d+'d</span><div style="flex:1;min-width:0"><div style="font-weight:500">'+fd(x.f)+' – '+fd(x.t)+' <span class="tag" style="background:'+t[1]+';color:'+t[2]+';font-weight:400">'+t[0]+(x.lv.length?' · '+x.lv.length+' leave'+(x.lv.length>1?'s':''):'')+'</span></div><div style="color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+esc(x.n)+'">'+esc(x.n)+'</div></div>'+(x.lv.length&&x.f>=TODAY?'<button class="sb" style="'+(on?'background:var(--pub);color:var(--put);border-color:var(--pu)':'')+'" onclick="planLW('+i+')">'+(on?'Planned':'Plan it')+'</button>':'')+'</div>'}
function x_f(i){const f=LW[i].f;return f.slice(0,4)==String(Y)?+f.slice(5,7)-1:m}
function lwGroup(title,mm){const yy=Y+Math.floor(mm/12),pre=yy+'-'+pad(mm%12+1),it=LW.map((x,i)=>[x,i]).filter(([x])=>x.f.startsWith(pre)||(x.f<pre+'-01'&&x.t>=pre+'-01'&&mm%12==0&&yy>Y));
return '<div class="sh">'+title+'</div>'+(it.length?it.map(([x,i])=>lwRow(x,i)).join(''):'<div style="font-size:12px;color:var(--text-muted);margin-top:4px">'+(yy>Y&&!D.next_year_holidays?'HR hasn\'t published '+yy+' holidays yet':'None this month')+'</div>')}
function side(){const T=[['lw','Long weekends'],['att','Attention '+ATT.length],['opt','Optional']];
